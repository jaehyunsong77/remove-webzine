.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:6;width:44px;height:44px;display:grid;place-items:center;color:#B9A893}
.x svg{width:22px;height:22px}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:18px;z-index:6;font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--muted)}

/* text column */
.col{position:absolute;z-index:4;display:flex;flex-direction:column;align-items:center;text-align:center;
  left:50%;transform:translateX(-50%);width:min(100% - 32px, 380px);top:calc(env(safe-area-inset-top,0px) + 52px)}
.title-art{display:block;width:min(100%, 300px, 23vh * 1.69);height:auto;overflow:visible}
.sticker{font:12.5px 'Gloock',Georgia,serif;fill:#2c3a0e}
.copy{margin:8px 0 0;font:400 13px/1.55 var(--ko);letter-spacing:.01em;word-break:keep-all}
.mood{position:relative;margin-top:12px;width:100%;max-width:330px}
.mood select{appearance:none;-webkit-appearance:none;width:100%;height:44px;border:1px solid var(--line);border-radius:0;background:transparent;
  padding:0 40px 0 14px;font:400 13px/1 var(--ko);color:var(--ink);cursor:pointer}
.mood select.empty{color:#A08C78}
.mood::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border:solid var(--ink);border-width:0 1.5px 1.5px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.spin{margin-top:12px;width:100%;max-width:330px;height:52px;border:1.5px solid var(--line);border-radius:999px;background:var(--btn);
  font:600 19px/1 var(--mono);letter-spacing:.04em;cursor:pointer;transition:transform .12s ease,background .2s}
.spin:active{transform:scale(.97)}
.spin.stop{background:var(--tang)}
.nothanks{margin-top:6px;padding:8px 10px;font:400 12.5px/1 var(--ko);letter-spacing:.06em}

/* wheel */
.wheel-wrap{position:absolute;z-index:2;touch-action:manipulation;cursor:pointer}
.wheel{width:100%;height:100%;will-change:transform}
.wheel svg{display:block;width:100%;height:100%;overflow:visible}
.seg{transition:opacity .35s ease}
.wheel.done .seg:not(.win){opacity:.38}
.lbl{font:400 21px 'Galmuri11',var(--head);fill:var(--ink);letter-spacing:0}
.pointer{position:absolute;z-index:3;width:52px;height:52px;pointer-events:none;transform-origin:0 0}
.pointer svg{display:block;width:52px;height:52px;overflow:visible;transform-origin:4px 48px;transition:transform .16s cubic-bezier(.3,1.6,.5,1)}
.pointer.kick svg{transition:none;transform:rotate(-16deg)}

/* result */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(62,34,22,.34);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.card{position:relative;width:min(100%,440px);max-height:92%;overflow:auto;background:var(--bg);border:1.5px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.sheet.on .card{transform:none}
.card .close{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:#A08C78;cursor:pointer}
.card .close svg{width:18px;height:18px}
.kicker{font:600 11px/1 var(--mono);letter-spacing:.16em}
.photo{position:relative;margin-top:14px;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#eee8da}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:-6px;top:-16px;width:150px;height:auto;transform:rotate(-8deg);overflow:visible}
.badge text{font:15px 'Gloock',Georgia,serif;fill:#3E2216}
.name{margin:16px 0 0;font:800 25px/1.25 var(--head);letter-spacing:-.03em;word-break:keep-all}
.hook{margin:8px 0 0;font:400 14px/1.5 var(--ko)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font:400 12px/1 var(--ko);background:#fff}
.chip.c0{background:var(--green-l)} .chip.c1{background:var(--yellow)}
.why{margin:12px 0 0;padding:12px 14px;background:#fff;border:1px solid var(--line);font:400 13px/1.55 var(--ko);word-break:keep-all}
.why b{font-weight:700}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font:400 12px/1.4 var(--ko);color:var(--muted)}
.meta b{color:var(--ink);font-weight:700}
.go{display:flex;align-items:center;justify-content:center;margin-top:16px;height:54px;border:1.5px solid var(--line);border-radius:999px;background:var(--btn);font:700 16px/1 var(--ko);letter-spacing:.02em}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 button{flex:1;height:48px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font:700 14px/1 var(--ko);cursor:pointer}
.row2 .save{background:var(--yellow)}

/* story image preview */
.story{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(40,22,14,.84)}
.story.on{display:flex}
.story img{max-height:72vh;max-width:100%;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.4);-webkit-touch-callout:default}
.story p{margin:0;color:#fff;font:400 13px/1.6 var(--ko);text-align:center}
.story .row{display:flex;gap:8px}
.story a,.story button{height:44px;padding:0 18px;display:inline-flex;align-items:center;border:1.5px solid #fff;border-radius:999px;background:transparent;color:#fff;font:700 13px/1 var(--ko);cursor:pointer}
.story a{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}

@media (prefers-reduced-motion:reduce){.pointer svg,.card,.sheet,.seg{transition:none}}
/* wide screens: wheel on the left like a pop-up, text on the right */
@media (min-width:760px) and (min-aspect-ratio:1/1){
  .col{left:auto;right:max(4vw, 50% - 520px);transform:none;top:50%;translate:0 -50%;width:380px}
  .title-art{width:340px}
  .copy{font-size:14px}
  .sheet{align-items:center}
  .card{border-bottom:1.5px solid var(--line);border-radius:26px;padding-bottom:20px}
}
</style>

// ?embed: the roulette runs as a layer inside the webzine (an iframe over the home screen) and talks to it by message
const EMBED = new URLSearchParams(location.search).has('embed') && parent !== window;
const dl = EMBED ? (parent.dataLayer = parent.dataLayer || []) : (window.dataLayer = window.dataLayer || []);
const tell = msg => parent.postMessage(msg, location.origin);
const $ = id => document.getElementById(id);
const N = ACTS.length, SEG = 360 / N;
const COLORS = ['#A9C35E', '#FBE79F', '#8FB8E6', '#F4823F', '#F5C6CF'];   // grass, butter, sky, tangerine, blossom
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- wheel drawing (viewBox units: rim outer 292, segments 276)
const RO = 292, RS = 276;
function arc(a0, a1, r) {
  const p = a => [Math.cos(a * Math.PI / 180) * r, Math.sin(a * Math.PI / 180) * r];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M0 0L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;
}
(function drawWheel() {
  let s = `<svg viewBox="-300 -300 600 600"><defs><filter id="hs" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity=".16"/></filter></defs>`;
  s += `<circle r="${RO}" fill="#FFFDF6" stroke="#DCCFB2" stroke-width="3"/>`;
  ACTS.forEach((a, i) => {
    s += `<path class="seg" data-i="${i}" d="${arc(i * SEG, (i + 1) * SEG, RS)}" fill="${COLORS[i % COLORS.length]}"/>`;
  });
  ACTS.forEach((a, i) => {
    const mid = i * SEG + SEG / 2;
    s += `<g class="seg" data-i="${i}" transform="rotate(${mid})"><text class="lbl" x="${(RS + 96) / 2 + 6}" y="7" text-anchor="middle">${a.wheel}</text></g>`;
  });
  for (let i = 0; i < N; i++) {
    const a = i * SEG * Math.PI / 180, r = (RO + RS) / 2;
    s += `<circle cx="${(Math.cos(a) * r).toFixed(2)}" cy="${(Math.sin(a) * r).toFixed(2)}" r="4" fill="#BBA684"/>`;
  }
  s += `<circle r="86" fill="#FFFDF6" stroke="#EDE3CC" stroke-width="2" filter="url(#hs)"/></svg>`;
  $('wheel').innerHTML = s;
})();

// ---------- layout: phone = wheel under the text, pointer on top; wide = wheel on the left, pointer upper right
let L = { cx: 0, cy: 0, R: 200, P: -90 };
function layout() {
  const W = innerWidth, H = innerHeight, wide = W >= 760 && W >= H;
  if (wide) {
    const R = Math.min(H * 0.42, W * 0.34, 380);
    L = { R, cx: Math.max(R * 0.2, W / 2 - 600 + R * 0.2), cy: H / 2, P: -32 };
  } else {
    const col = $('col').getBoundingClientRect();
    const R = Math.max(210, Math.min(W * 0.66, 330));
    const top = col.bottom + 58;                       // rim top sits under the text, leaving room for the pointer
    L = { R, cx: W / 2, cy: top + R, P: -90 };
  }
  const s = L.R / RO, size = 600 * s, w = $('wrap');
  w.style.width = w.style.height = size + 'px';
  w.style.left = (L.cx - size / 2) + 'px'; w.style.top = (L.cy - size / 2) + 'px';
  // pointer: its sharp corner (4,48 in its box) touches the rim, aimed at the centre
  const pr = (RO - 10) * s, a = L.P * Math.PI / 180;
  const tx = L.cx + Math.cos(a) * pr, ty = L.cy + Math.sin(a) * pr;
  const p = $('pointer');
  p.style.left = (tx - 4) + 'px'; p.style.top = (ty - 48) + 'px';
  p.style.transformOrigin = '4px 48px';
  p.style.transform = `rotate(${L.P + 180 - 135}deg)`;
}
addEventListener('resize', layout);
document.fonts && document.fonts.ready.then(layout);
layout();

// ---------- spin
let rot = 0, vel = reduce ? 0 : 5, mode = 'idle', target = -1, last = performance.now();
let dec = null, autoStop = 0, lastIdx = -1, mood = '';
const wheelEl = $('wheel'), btn = $('roulette-spin');
// the button's id follows its label (roulette-spin → roulette-stop → roulette-spin-again) so click counts can tell them
// apart; it changes a tick after the click, once GTM has read the id that was clicked
function label(t, id) { setTimeout(() => { btn.textContent = t; btn.id = id; }); }
const idxAt = r => Math.floor((((L.P - r) % 360) + 360) % 360 / SEG);

function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (mode === 'idle') rot += vel * dt;
  else if (mode === 'spin') { vel = Math.min(900, vel + 2600 * dt); rot += vel * dt; if (t > autoStop) stop(); }
  else if (mode === 'stop') {
    const k = Math.min(1, (t - dec.t0) / dec.T), e = 1 - Math.pow(1 - k, 3);
    rot = dec.r0 + dec.d * e;
    if (k >= 1) land();
  }
  wheelEl.style.transform = `rotate(${rot}deg)`;
  const i = idxAt(rot);
  if (i !== lastIdx && mode !== 'idle') tick();
  lastIdx = i;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function tick() {
  const p = $('pointer'); p.classList.add('kick');
  requestAnimationFrame(() => requestAnimationFrame(() => p.classList.remove('kick')));
  if (navigator.vibrate) try { navigator.vibrate(3); } catch (e) {}
}
function pickTarget() {
  const pool = ACTS.map((a, i) => i).filter(i => !mood || ACTS[i].moods.includes(mood));
  return pool[Math.floor(Math.random() * pool.length)];
}
function spin() {
  if (mode === 'spin') return stop();
  if (mode === 'stop') return;
  closeSheet(true);
  wheelEl.classList.remove('done');
  wheelEl.querySelectorAll('.win').forEach(e => e.classList.remove('win'));
  target = pickTarget();
  new Image().src = photoOf(ACTS[target]);           // load the result photo while it spins
  mode = 'spin'; vel = Math.max(vel, 120); autoStop = performance.now() + (reduce ? 300 : 2600);
  label('STOP!', 'roulette-stop'); btn.classList.add('stop');
  dl.push({ event: 'roulette_spin', mood: mood || 'none' });
}
function stop() {
  if (mode !== 'spin') return;
  // land inside the target segment (not on its edge), after at least one more full turn
  const want = L.P - (target * SEG + SEG * (0.2 + Math.random() * 0.6));
  let d = ((want - rot) % 360 + 360) % 360;
  const v0 = Math.max(vel, 200);
  while (3 * d / v0 < (reduce ? 0.6 : 2.6)) d += 360;
  dec = { t0: performance.now(), r0: rot, d, T: 3 * d / v0 * 1000 };
  mode = 'stop'; label('두근두근…', 'roulette-stop'); btn.classList.remove('stop');
}
function land() {
  mode = 'done'; vel = 0;
  wheelEl.classList.add('done');
  wheelEl.querySelectorAll(`[data-i="${target}"]`).forEach(e => e.classList.add('win'));
  label('SPIN AGAIN', 'roulette-spin-again');
  const a = ACTS[target];
  dl.push({ event: 'roulette_result', activity: a.slug, mood: mood || 'none' });
  $('live').textContent = '결과: ' + a.ko;
  setTimeout(() => openSheet(a), reduce ? 0 : 650);
}
btn.addEventListener('click', spin);
$('wrap').addEventListener('click', spin);
$('mood').addEventListener('change', e => {
  mood = e.target.value; e.target.classList.toggle('empty', !mood);
  if (mood) dl.push({ event: 'roulette_mood', mood });
});

// ---------- result
const photoOf = a => a.photo;
let current = null;
function openSheet(a) {
  current = a;
  $('rimg').src = photoOf(a); $('rimg').alt = a.ko;
  $('rname').textContent = a.ko;
  $('rhook').textContent = '“' + a.hook + '”';
  $('rchips').innerHTML = a.moods.map((m, i) => `<span class="chip c${i}">#${m}</span>`).join('') + a.feel.slice(0, 2).map(f => `<span class="chip">${f}</span>`).join('');
  const w = a.why.find(x => x.mood === mood) || a.why[0];
  $('rwhy').innerHTML = `<b>${w.mood}일 때</b> ${w.text}`;
  $('rregion').textContent = '📍 ' + a.region;
  $('rprice').textContent = a.from;
  $('rgo').href = a.slug + '.html';
  $('sheet').classList.add('on');
}
function closeSheet(quiet) { $('sheet').classList.remove('on'); }
$('close').onclick = () => closeSheet();
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
$('roulette-spin-again-card').onclick = () => { closeSheet(); spin(); };
$('rgo').addEventListener('click', () => dl.push({ event: 'roulette_detail', activity: current && current.slug }));
if (EMBED) {   // close goes back to the home screen underneath; an activity opens in the webzine itself
  document.querySelectorAll('a[href="index.html"]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); tell({ spin: 'close' }); }));
  $('rgo').addEventListener('click', e => { e.preventDefault(); if (current) tell({ spin: 'detail', slug: current.slug }); });
  // the webzine's GTM can't see clicks inside this frame, so its click triggers get the same gtm.click it would push
  // itself (capture phase: before the button's own handler changes its id)
  document.addEventListener('click', e => {
    const el = e.target.closest && e.target.closest('[id^="roulette-"]');
    if (el) dl.push({ event: 'gtm.click', 'gtm.element': el, 'gtm.elementId': el.id, 'gtm.elementClasses': el.getAttribute('class') || '',
      'gtm.elementUrl': el.href || '', 'gtm.elementTarget': el.target || '' });
  }, true);
}

// ---------- story image (1080x1920), shown so it can be long-pressed and saved in the Instagram browser
const TITLE_SRC = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(document.querySelector('.title-art').outerHTML.replace(/<g class="stk"[\s\S]*?<\/g>/, '').replace('<svg ', '<svg width="660" height="390" '));
function loadImg(src) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
function rr(x, ctx, X, Y, W, H, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
async function makeStory(a) {
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const x = c.getContext('2d');
  x.fillStyle = '#FFF8E8'; x.fillRect(0, 0, 1080, 1920);
  const [t, p] = await Promise.all([loadImg(TITLE_SRC), loadImg(photoOf(a))]);
  x.drawImage(t, 150, 120, 780, 461);
  // photo, cover-cropped into a bordered rounded box
  const X = 110, Y = 640, W = 860, H = 645;
  x.save(); rr(x, null, X, Y, W, H, 40); x.clip();
  const s = Math.max(W / p.naturalWidth, H / p.naturalHeight), pw = p.naturalWidth * s, ph = p.naturalHeight * s;
  x.drawImage(p, X + (W - pw) / 2, Y + (H - ph) / 2, pw, ph); x.restore();
  rr(x, null, X, Y, W, H, 40); x.lineWidth = 4; x.strokeStyle = '#3E2216'; x.stroke();
  // sticker
  x.save(); x.translate(860, 650); x.rotate(-8 * Math.PI / 180);
  x.beginPath(); x.ellipse(0, 0, 170, 62, 0, 0, Math.PI * 2); x.fillStyle = '#FBE79F'; x.fill(); x.lineWidth = 3.5; x.strokeStyle = '#5a3a1a'; x.stroke();
  x.fillStyle = '#3E2216'; x.font = '40px Gloock, Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('Lucky you!', 0, 4); x.restore();
  x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.fillStyle = '#3E2216';
  x.font = '600 30px "Azeret Mono", monospace'; x.fillText('MY JEJU PICK ✦', X, 1370);
  x.font = '800 80px "Noto Sans KR", sans-serif'; let y = wrap(x, a.ko, X, 1470, W, 92);
  x.font = '400 40px "Nanum Gothic Coding", monospace'; y = wrap(x, '“' + a.hook + '”', X, y + 100, W, 56);
  // mood chips
  y += 96; let cx = X; x.font = '400 32px "Nanum Gothic Coding", monospace';
  a.moods.forEach((m, i) => {
    const t = '#' + m, w = x.measureText(t).width + 50;
    rr(x, null, cx, y - 44, w, 64, 32); x.fillStyle = i ? '#FBE79F' : '#D5E7A0'; x.fill();
    x.lineWidth = 3; x.strokeStyle = '#3E2216'; x.stroke(); x.fillStyle = '#3E2216'; x.fillText(t, cx + 25, y); cx += w + 14;
  });
  x.font = '600 28px "Azeret Mono", monospace'; x.fillStyle = '#8A6F5A';
  x.fillText('@re.move.jeju', X, 1820); x.textAlign = 'right'; x.fillText('SPIN TO PICK →', X + W, 1820);
  return c.toDataURL('image/png');
}
function wrap(x, text, X, Y, W, lh) {
  let line = '', y = Y;
  for (const ch of text) { if (x.measureText(line + ch).width > W && line) { x.fillText(line, X, y); line = ch.trim() ? ch : ''; y += lh; } else line += ch; }
  x.fillText(line, X, y);
  return y;
}
$('save').onclick = async () => {
  if (!current) return;
  $('save').textContent = '만드는 중…';
  try {
    const url = await makeStory(current);
    $('simg').src = url; $('sdl').href = url; $('story').classList.add('on');
    dl.push({ event: 'roulette_save', activity: current.slug });
  } catch (e) { alert('이미지를 만들지 못했어요. 화면을 캡처해 주세요!'); }
  $('save').textContent = '결과 이미지 저장';
};
$('sclose').onclick = () => $('story').classList.remove('on');
const pick = new URLSearchParams(location.search).get('pick');
const pi = ACTS.findIndex(a => a.slug === pick);
if (pi >= 0) { target = pi; mode = 'done'; vel = 0; rot = L.P - (pi * SEG + SEG / 2); wheelEl.classList.add('done');
  wheelEl.querySelectorAll(`[data-i="${pi}"]`).forEach(e => e.classList.add('win')); label('SPIN AGAIN', 'roulette-spin-again'); openSheet(ACTS[pi]); }
</script>
