:root{
  color-scheme:only light;
  --bg:#fff;--ink:#0b0b0c;--mut:#8a8a8f;--line:#e8e8ea;
  --sans:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;gap:10px;height:100vh;height:100dvh;max-width:560px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

/* top: the wordmark, and 홈 back to the webzine — the webzine's own white pill (its mood buttons) */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 4px}
.logo{display:inline-flex;align-items:baseline;gap:9px;color:var(--ink);text-decoration:none}
.logo b{font:400 22px/1 "Array-Wide",ui-monospace,monospace;letter-spacing:.0625em;text-shadow:.0625em 0 0 currentColor}
.logo span{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--mut)}
.home{position:relative;display:inline-flex;align-items:center;padding:8px 18px;border:1px solid rgba(11,11,12,.86);border-radius:999px;color:var(--ink);
  font:500 15px/1.15 var(--sans);letter-spacing:-.01em;text-decoration:none;cursor:pointer;
  background:linear-gradient(#fff 0%,#f2f2f4 60%,#e8e8ec 100%);
  box-shadow:inset 0 1px 0 #fff,0 2px 0 rgba(11,11,12,.07),0 4px 10px -3px rgba(16,16,20,.2);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s ease}
@media (hover:hover){ .home:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,0 3px 0 rgba(11,11,12,.07),0 10px 18px -6px rgba(16,16,20,.28)} }
.home:active{transform:translateY(1px);box-shadow:inset 0 1px 3px rgba(16,16,20,.18)}

/* the picker: the games as small pixel pictures, the name under each in plain black; the chosen one is ringed. Once a game
   is chosen the pictures fold away into one line (the chosen game, and 다른 게임 with its arrow), so the game below gets
   the height; the arrow, or that line, opens them again, and they open by themselves when a game ends (2026-11-05, the
   user: the games were cut off under the pictures) */
.pick{flex:none;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 10px 24px -18px rgba(16,16,20,.35);overflow:hidden}
.pick-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .38s cubic-bezier(.2,.8,.2,1)}
.pick-body>div{min-height:0;overflow:hidden}
.pick[data-open="false"] .pick-body{grid-template-rows:0fr}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px}
.fold{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0;padding:0;border:0;background:none;color:var(--mut);
  font:400 13px/1 var(--sans);letter-spacing:-.01em;cursor:pointer;-webkit-tap-highlight-color:transparent}
.fold .chev{display:block;width:20px;height:20px;flex:none;transition:transform .3s ease}
.fold .now{display:none;align-items:center;gap:10px;min-width:0;color:var(--ink);font:500 14px/1.2 var(--sans)}
.fold .now .mini{display:block;width:44px;aspect-ratio:16/10;flex:none;border-radius:7px;overflow:hidden;box-shadow:0 0 0 1.5px var(--ink)}
.fold .now .mini svg{display:block;width:100%;height:100%}
.fold .now b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold .more{display:flex;align-items:center;gap:2px;white-space:nowrap}
.fold .more span{display:none}
.pick[data-open="true"] .fold{height:26px;margin-top:-6px}   /* open: just the arrow, under the pictures */
.pick[data-open="false"] .fold{height:46px;padding:0 10px 0 8px;justify-content:space-between}
.pick[data-open="false"] .fold .now{display:flex}
.pick[data-open="false"] .fold .more span{display:inline}
.pick[data-open="false"] .fold .chev{transform:rotate(180deg)}
@media (hover:hover){ .fold:hover{color:var(--ink)} }
.pick:not([data-game]) .fold{display:none}   /* nothing chosen yet: the pictures stay open, with no arrow */
.tab{display:flex;flex-direction:column;gap:7px;min-width:0;margin:0;padding:6px 6px 9px;border:0;border-radius:16px;background:transparent;color:var(--ink);
  font:400 14px/1.25 var(--sans);letter-spacing:-.01em;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .2s ease,transform .12s ease}
.tab .th{display:block;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#eef1f4;transition:box-shadow .2s ease}
.tab .th svg{display:block;width:100%;height:100%}
.tab .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){ .tab:hover{background:#f6f6f7} }
.tab:active{transform:scale(.97)}
.tab[aria-selected="true"]{background:#f3f3f5}
.tab[aria-selected="true"] .th{box-shadow:0 0 0 2px var(--ink)}
.tab[aria-selected="true"] .nm{font-weight:500}
.tab:focus-visible,.home:focus-visible,.logo:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* the stage: the chosen game fills it */
.stage{position:relative;flex:1 1 auto;min-height:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--g,#fff);
  box-shadow:0 14px 30px -22px rgba(16,16,20,.4);transition:background-color .3s ease}
.stage iframe{display:block;width:100%;height:100%;border:0}
/* a game that is not ready yet: its picture, larger, and a line */
.soon-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;word-break:keep-all}
.soon-card .ph{width:min(280px,76%);aspect-ratio:16/10;margin-bottom:8px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 2px var(--ink)}
.soon-card .ph svg{display:block;width:100%;height:100%}
.soon-card h2{margin:0;font:700 20px/1.35 var(--sans);letter-spacing:-.03em;color:var(--ink)}
.soon-card p{margin:0;font:400 14px/1.7 var(--sans);color:#55565b}
/* before a game is chosen: one quiet line pointing up at the pictures */
.pick-me{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;color:var(--mut);
  font:400 14px/1.6 var(--sans);text-align:center;word-break:keep-all}
.pick-me svg{width:22px;height:22px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}

@media (max-width:359px){ .tab{font-size:12.5px} }
@media (min-width:768px){ .app{gap:14px;padding-top:calc(18px + env(safe-area-inset-top,0px))} .tab{font-size:15px} }
@media (prefers-reduced-motion:reduce){ .tab,.home,.stage,.tab .th,.pick-body,.fold .chev{transition:none} .pick-me svg{animation:none} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="logo" href="./" id="games-logo" aria-label="Re.move 처음 화면"><b>Re.move</b><span>MINI GAME</span></a>
    <a class="home" href="./" id="games-home">홈</a>
  </header>
  <!-- each tab: data-game is its name in the address (#ssalbbang); data-src is the game's page (a tab without one says it

       the team's artifact page as it was) -->
  <section class="pick" id="games-picker" data-open="true">

  </button>
  </section>
  <main class="stage" id="stage" role="tabpanel"></main>

const PAL = {
  S: '#D9EFFB', s: '#BFE3F7', w: '#FFFFFF', m: '#9EBFD2', g: '#8FCB6C', G: '#73B455', b: '#D8B07D', B: '#BF915C',   // sky, cloud, 한라산, grass, dirt
  k: '#2E2A28', h: '#A6ABB1', r: '#E5503F', R: '#B83A2E', d: '#3B3A39', y: '#FFE27A',                                // the ATV
  q: '#CFE8F7', Q: '#E6F3FB', P: '#F6C6D5', e: '#FFFFFF', E: '#E5D2C2', n: '#D7BC8B', c: '#FFF6E4', p: '#F0DDB6', v: '#C9CED4',   // stripes, table, plate, the bun, steam
  f: '#FBEFDA', F: '#F2DDBC', H: '#E7CDA4', o: '#F59130', O: '#FFBE6E', a: '#E0761C', D: '#C25E15', x: '#6B4A2B', l: '#72B64C', L: '#4F9536', z: '#F59130',   // the tangerine
};
const W = 32, Hh = 20;
const sprite = (rows, ox, oy) => (x, y) => { const r = rows[y - oy], c = r && r[x - ox]; return c && c !== '.' ? c : ''; };
const layer = (...fns) => (x, y) => { for (const f of fns) { const k = f(x, y); if (k) return k; } return ''; };
const at = (cells, key) => { const set = new Set(cells.map(([x, y]) => x + ',' + y)); return (x, y) => set.has(x + ',' + y) ? key : ''; };
function svg(fn) {   // one rect per run of a colour along a row
  let out = '';
  for (let y = 0; y < Hh; y++) for (let x = 0; x < W;) { const k = fn(x, y); let n = 1; while (x + n < W && fn(x + n, y) === k) n++; if (k) out += `<rect x="${x}" y="${y}" width="${n}" height="1.02" fill="${PAL[k]}"/>`; x += n; }
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" aria-hidden="true">${out}</svg>`;
}
const ATV = [
  '...........kk.....',
  '..........k.......',
  '....dddd..k.......',
  '...rrrrrrrrrrrr...',
  '..rrrrrrrrrrrrry..',
  '..RkkRRRRRRRkkRR..',
  '.kkkkk.....kkkkk..',
  '.kkhkk.....kkhkk..',
  '.kkkkk.....kkkkk..',
  '..kkk.......kkk...',
];
const BUN = [
  '....v...v...v...',
  '.....v...v...v..',
  '....v...v...v...',
  '................',
  '.....nnnnnn.....',
  '...nnccccccnn...',
  '..ncwwcccccccn..',
  '.ncwwcccccccccn.',
  '.nccccccccccccn.',
  '.nppppppppppppn.',
  '..nnnnnnnnnnnn..',
];
const LEAF = [
  '..xll....',
  '..xllll..',
  '..x.lLL..',
];
const SCENES = {
  atv: layer(sprite(ATV, 7, 7),
    at([[4, 2], [5, 2], [6, 2], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3], [21, 1], [22, 1], [23, 1], [24, 1], [20, 2], [21, 2], [22, 2], [23, 2], [24, 2], [25, 2]], 'w'),
    (x, y) => y < 4 ? 'S' : y < 13 ? (y >= 7 && Math.abs(x - 11) <= (y - 7) * 1.7 + 1.5 ? 'm' : 's')
      : y >= 15 && y <= 17 ? ((x * 3 + y * 5) % 7 === 0 ? 'B' : 'b') : ((x * 5 + y * 3) % 9 === 0 ? 'G' : 'g')),
  bread: layer(sprite(BUN, 8, 2),
    (x, y) => { const t = ((x - 15.5) / 9.5) ** 2 + ((y - 14.5) / 2.3) ** 2; return t <= 1 ? (t > .72 ? 'E' : 'e') : ''; },
    (x, y) => y < 13 ? (Math.floor(y / 2) % 2 ? 'Q' : 'q') : 'P'),
  tangerine: layer(sprite(LEAF, 14, 1),
    (x, y) => {   // the fruit: an outlined round, lit from the top left
      const dx = (x + .5 - 16) / 7.2, dy = (y + .5 - 10.8) / 6.6, t = Math.hypot(dx, dy);
      if (t > 1) return '';
      if (t > .86) return 'D';
      if (Math.abs(dx + .42) < .1 && Math.abs(dy + .45) < .12) return 'w';
      return dx + dy < -.75 ? 'O' : dx + dy > .7 ? 'a' : 'o';
    },
    at([[6, 3], [7, 4], [4, 7], [5, 7], [6, 7], [6, 11], [7, 10]], 'z'),
    (x, y) => { if (y >= 16 && ((x - 16) / 7.5) ** 2 + ((y - 17.4) / 1.3) ** 2 <= 1) return 'H'; return y < 16 ? 'f' : 'F'; }),
};
const tabs = [...document.querySelectorAll('.tab')], stage = $('stage');
tabs.forEach(t => { t.querySelector('.th').innerHTML = svg(SCENES[t.dataset.pix]); });

/* ---------- the games ---------- */
// ?embed: this page is a layer inside the webzine (index.html) and talks to it by message
const EMBED = new URLSearchParams(location.search).has('embed') && parent !== window;
const tell = msg => parent.postMessage(msg, location.origin);
const dl = () => { try { return EMBED ? (parent.dataLayer = parent.dataLayer || []) : (window.dataLayer = window.dataLayer || []); } catch (e) { return []; } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// this page's query with ?game= set to a game (or taken off); the rest (?lang=en …) stays
const withGame = game => { const p = new URLSearchParams(location.search); p.delete('game'); p.delete('embed'); if (game) p.set('game', game); const q = p.toString(); return q ? '?' + q : ''; };

// a game in its own new frame each time (the last one goes, and stops); a game without a page says it is coming
function pick(tab, via) {
  tabs.forEach(t => { const on = t === tab; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
  stage.style.setProperty('--g', tab.style.getPropertyValue('--g'));
  stage.setAttribute('aria-labelledby', tab.id);
  stage.textContent = '';
  const name = tab.querySelector('.nm').textContent;
  stage.dataset.game = tab.dataset.game;
  if (tab.dataset.src) {
    const f = document.createElement('iframe');
    f.id = 'game-' + tab.dataset.game;   // each game's frame by its own id: game-atv, game-ssalbbang, game-tangerine
    f.title = name; f.src = tab.dataset.src; f.allow = 'fullscreen; autoplay';
    f.addEventListener('load', () => { try { f.contentDocument.addEventListener('click', inApp, true); } catch (e) {} });
    stage.appendChild(f); fitFrame();
  } else {
    stage.innerHTML = `<div class="soon-card"><div class="ph">${svg(SCENES[tab.dataset.pix])}</div>` +
      `<h2>${esc(name)}은 준비 중이에요</h2><p>완성되면 여기서 바로 할 수 있어요.<br>그동안 다른 게임을 먼저 해 보세요!</p></div>`;
  }
  // the address names the game (…/games?game=atv): in the layer the webzine's address changes (it is told), on its own
  // this page's; replaced, not added, so the back button has no extra steps
  document.title = name + ' | Re.move 미니게임';
  if (EMBED) tell({ games: 'pick', game: tab.dataset.game });
  else try { history.replaceState(null, '', location.pathname + withGame(tab.dataset.game)); } catch (e) {}
  if (via) dl().push({ event: 'game_select', game_name: tab.dataset.game, via });
  // the folded line shows this game; the pictures fold away a moment after the ring lands on it
  pickEl.dataset.game = tab.dataset.game;
  foldBtn.querySelector('.mini').innerHTML = svg(SCENES[tab.dataset.pix]);
  foldBtn.querySelector('.now b').textContent = name;
  wasEnded = false; autoOpened = false;
  clearTimeout(foldTimer); foldTimer = setTimeout(() => setOpen(false), via ? 320 : 0);
}

/* ---------- the picker folds away while a game is played ---------- */
const pickEl = $('games-picker'), pickBody = $('games-picker-body'), foldBtn = $('games-fold');
let foldTimer = 0, wasEnded = false, autoOpened = false;
function setOpen(open) {
  clearTimeout(foldTimer);
  pickEl.dataset.open = String(open);
  pickBody.inert = !open;   // folded pictures take no focus
  foldBtn.setAttribute('aria-expanded', String(open));
  foldBtn.setAttribute('aria-label', open ? '게임 고르는 칸 접기' : '다른 게임 고르기');
}
foldBtn.addEventListener('click', () => { autoOpened = false; setOpen(pickEl.dataset.open !== 'true'); });
// each game's own end screen, read from its frame (same site): 감귤's result sheet, 쌀빵's celebration, ATV's 게임 종료
const ENDS = {
  tangerine: d => { const o = d.getElementById('over'); return !!o && !o.hidden; },
  ssalbbang: d => { const a = d.querySelector('.celebrate-actions'); return !!a && a.getClientRects().length > 0; },
  atv: d => { const g = d.getElementById('g'), gd = g && g.contentDocument, ov = gd && gd.getElementById('ov');
    return !!ov && !ov.classList.contains('hide') && /종료/.test((ov.querySelector('.h1') || {}).textContent || ''); },
};
function ended() {
  const f = stage.querySelector('iframe'), test = ENDS[pickEl.dataset.game];
  try { return !!(f && test && f.contentDocument && test(f.contentDocument)); } catch (e) { return false; }
}
// a game ends: the pictures open, so the next one can be picked; played again from its end screen: they fold back
setInterval(() => {
  const now = ended();
  if (now && !wasEnded) dl().push({ event: 'game_end', game_name: pickEl.dataset.game });
  if (now && !wasEnded && pickEl.dataset.open === 'false') { setOpen(true); autoOpened = true; }
  if (!now && wasEnded && autoOpened) { autoOpened = false; if (pickEl.dataset.open === 'true') setOpen(false); }
  wasEnded = now;
}, 600);
// a game laid out for a set height (data-min-h: 감귤 600, 쌀빵 680) in a shorter stage is drawn at that height and made
// smaller to fit, whole, instead of being cut off at the bottom; ATV fits any stage by itself
function fitFrame() {
  const f = stage.querySelector('iframe'), tab = tabs.find(t => t.dataset.game === stage.dataset.game); if (!f || !tab) return;
  const need = +tab.dataset.minH || 0, w = stage.clientWidth, h = stage.clientHeight, s = need && h && h < need ? h / need : 1;
  if (s < 1) Object.assign(f.style, { width: w / s + 'px', height: need + 'px', transform: 'scale(' + s + ')', transformOrigin: '0 0' });
  else Object.assign(f.style, { width: '', height: '', transform: '', transformOrigin: '' });
}
if (window.ResizeObserver) new ResizeObserver(fitFrame).observe(stage); else addEventListener('resize', fitFrame);
// a picture: its game (a new frame); the game already playing: the pictures just fold away again, or, once it has ended,
// it starts over
tabs.forEach(t => t.addEventListener('click', () => {
  if (t.getAttribute('aria-selected') !== 'true') pick(t, 'tab');
  else if (ended()) pick(t, 'again');
  else { autoOpened = false; setOpen(false); }
}));
// the arrow keys move between the tabs
document.querySelector('.tabs').addEventListener('keydown', e => {
  const i = tabs.indexOf(document.activeElement); if (i < 0) return;
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
  e.preventDefault(); const t = tabs[(i + d + tabs.length) % tabs.length]; t.focus(); pick(t, 'key');
});

// 홈 and the wordmark: back to the webzine (in the layer, it closes; on its own, a link)
['games-home', 'games-logo'].forEach(id => $(id).addEventListener('click', e => { if (EMBED) { e.preventDefault(); tell({ games: 'close' }); } }));
addEventListener('keydown', e => { if (e.key === 'Escape' && EMBED) tell({ games: 'close' }); });

// a game hands over an activity (the 쌀빵 game's "진짜 쌀빵 만들러가기" calls this from its frame): its page in the webzine
const PAGE_EXT = /\.github\.io$/.test(location.hostname) ? '' : '.html';
let handed = 0;   // one hand-over per click: the 쌀빵 button both links to the page (caught below) and calls this itself
window.__rouletteDetail = slug => {
  if (Date.now() - handed < 1500) return; handed = Date.now();
  if (EMBED) tell({ games: 'detail', slug }); else location.href = slug + PAGE_EXT;
};
// ... and a game's link to one of the webzine's own activity pages (the 감귤 game's "제주 감귤따기 체험 보러가기" opens
// lxwebzine.hankyung.com/2026-1/team2/tangerine.html in a new tab by itself) opens that page here the same way, so the
// webzine never goes a third step deep; the game's files stay as they are, and links to other sites are left alone
const SLUGS = ['atv', 'boat-fishing', 'horse-riding', 'jeju-dessert', 'oreum', 'paragliding', 'pottery', 'seaside-yoga', 'surfing', 'tangerine'];
const OURS = [location.host, 'lxwebzine.hankyung.com', 'jaehyunsong77.github.io'];
function inApp(e) {
  const a = e.target && e.target.closest && e.target.closest('a[href]'); if (!a) return;
  let u; try { u = new URL(a.getAttribute('href'), a.baseURI); } catch (x) { return; }
  const m = u.pathname.match(/\/([a-z-]+)(?:\.html)?$/);
  if (!OURS.includes(u.host) || !m || !SLUGS.includes(m[1])) return;
  e.preventDefault(); window.__rouletteDetail(m[1]);
}

// the game in the address (?game=atv, or an old #atv link) plays at once, folded; otherwise the three pictures stand open to
// pick from, and the stage points up at them
const want = new URLSearchParams(location.search).get('game') || location.hash.slice(1);
const start = tabs.find(t => t.dataset.game === want);
if (!EMBED && location.hash) try { history.replaceState(null, '', location.pathname + withGame(start ? start.dataset.game : null)); } catch (e) {}
if (start) pick(start, null);
else {
  tabs[0].tabIndex = 0; tabs.slice(1).forEach(t => { t.tabIndex = -1; });
  stage.innerHTML = '<div class="pick-me"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.5l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>하고 싶은 게임을 골라 주세요</div>';
}
})();
</script>
</body>
</html>
