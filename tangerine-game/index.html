<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fbf5ea">
<title>감귤 껍질 한 줄 까기 | RE:MOVE MINI GAME</title>
<!-- RE:MOVE 웹진 배포본 (v2.0 기준, Claude Code 제작). 배포용으로 바꾼 것: 화면 위 "팀 검토용 시안" 표시 제거, 페이지 제목에서 버전 번호 제거. 게임 코드·디자인은 v2.0과 같음.
     (v2.0: v1.9 + 볼터치 표정 + 힘 바 복구 + 끊어진 이유 구분 + 결과 버튼·감귤따기 체험 연결. GTM·GA4 코드 없음) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeon+Sung&family=Gamja+Flower&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" data-screen="start">

  <main class="stage" id="board" aria-label="감귤 껍질 한 줄 까기">
    <canvas id="cv" aria-hidden="true"></canvas>

    <!-- 1. 시작 화면 -->
    <section class="screen start" id="start">
      <canvas class="corner tl" id="c-tl" width="150" height="150" aria-hidden="true"></canvas>
      <canvas class="corner br" id="c-br" width="170" height="130" aria-hidden="true"></canvas>
      <button type="button" class="icon-btn snd" id="snd" aria-pressed="true" aria-label="소리와 진동" data-place="peel20_sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="off" d="M17 9l5 6M22 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <p class="series"><i class="mk"></i>RE:MOVE MINI GAME<i class="mk r"></i></p>
      <h1 class="title"><span>감귤 껍질</span><span class="u">한 줄 까기</span></h1>
      <canvas class="hero" id="hero" width="300" height="250" aria-hidden="true"></canvas>
      <p class="lead">한 번에, 끊김 없이<br>감귤 껍질을 길게 벗겨보세요!</p>
      <button type="button" class="btn primary big" id="go" data-place="peel20_start">게임 시작 <span class="chev" aria-hidden="true">›</span></button>
      <button type="button" class="rank-link" id="open-rank" data-place="peel20_rank_start"><span class="crown" aria-hidden="true"></span>TOP 5 랭킹</button>
    </section>

    <!-- 2·3. 게임 중 -->
    <div class="hud" id="hud" hidden>
      <div class="bar">
        <button type="button" class="icon-btn" id="back" aria-label="처음 화면으로" data-place="peel20_back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="pill" id="timer" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 9v4.5l3 1.6M9.5 3h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span id="time">00:00</span><i class="sep" aria-hidden="true"></i><b id="live-score">0</b><small>점</small></p>
        <p class="dots" id="dots"></p>
      </div>
      <!-- 힘 바(v1.5 복구): 지금 당기는 빠르기 ÷ 끊어지는 빠르기. 빨간 눈금을 넘으면 껍질이 끊어짐 -->
      <div class="power" aria-hidden="true"><span class="pw-l">힘</span><span class="pw-bar"><i id="pbar"></i><em class="pw-limit"></em></span></div>
      <p class="tag" id="tag"><canvas class="face" id="face" width="88" height="88" aria-hidden="true"></canvas><span id="tag-text">준비되었나요?</span></p>
      <p class="best-line" id="best-line"></p>
    </div>
    <div class="guide" id="guide" hidden>
      <svg class="hand" viewBox="0 0 44 48" aria-hidden="true"><path d="M17 24V10a3 3 0 0 1 6 0v11m0-2.5a3 3 0 0 1 6 0V22m0-1.5a3 3 0 0 1 6 0V30c0 7-4.5 12-11 12h-1.5c-4 0-6.5-2-8.6-5.4L7.5 29a3 3 0 0 1 5-3.2L17 31" fill="#fffdf8" stroke="#4b3426" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 5l1.6 2.4M20 2.5v3M27 5l-1.6 2.4" stroke="#4b3426" stroke-width="1.6" stroke-linecap="round"/></svg>
      <p>점선을 따라<br>감귤 껍질을 벗겨보세요!</p>
    </div>
    <p class="hint" id="hint" aria-hidden="true"></p>
    <p class="pop" id="pop" aria-hidden="true"></p>
    <p class="sr" id="live" aria-live="polite"></p>

    <!-- 4. 결과 -->
    <section class="screen result" id="over" hidden>
      <canvas class="corner br" id="c-br2" width="150" height="120" aria-hidden="true"></canvas>
      <p class="series"><i class="mk"></i>RE:MOVE MINI GAME<i class="mk r"></i></p>
      <h2 class="r-title"><i class="mk"></i><span id="r-title">완성!</span><i class="mk r"></i></h2>
      <canvas class="r-art" id="r-art" width="340" height="280" aria-hidden="true"></canvas>
      <!-- 점수: 이번 점수 · 내 최고점수 · 갱신 여부(또는 최고 기록까지 남은 점수) -->
      <div class="score" id="score">
        <canvas class="face" id="r-face" width="120" height="120" aria-hidden="true"></canvas>
        <p class="s-now"><em>이번 점수</em><b id="r-score">0</b></p>
        <p class="s-best"><em>내 최고점수</em><b id="r-best">0</b></p>
        <p class="s-msg" id="r-msg"></p>
      </div>
      <p class="r-rank" id="r-rank"><span id="r-rank-text"></span><button type="button" class="rank-link sm" id="open-rank2" data-place="peel20_rank_result">TOP 5 보기</button></p>
      <p class="r-sub" id="r-sub"></p>
      <p class="r-break" id="r-break"></p>
      <div class="btns">
        <button type="button" class="btn ghost" id="alt" data-place="peel20_home">메인으로</button>
        <button type="button" class="btn primary" id="main" data-place="peel20_retry">다시하기</button>
      </div>
      <button type="button" class="retry-link" id="retry-link" hidden data-place="peel20_retry_small">다시하기</button>
      <a class="cta" id="cta" href="#" target="_blank" rel="noopener" data-place="peel20_experience_tangerine"><span id="cta-label">제주 감귤따기 체험 보러가기</span><span aria-hidden="true">→</span></a>
    </section>

    <!-- 단계별 TOP 5 랭킹(아래에서 올라오는 시트) -->
    <section class="rank-sheet" id="rank" hidden role="dialog" aria-modal="true" aria-labelledby="rank-h">
      <div class="rank-card">
        <button type="button" class="icon-btn rank-x" id="rank-close" aria-label="랭킹 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <h2 class="rank-h" id="rank-h">TOP 5</h2>
        <p class="rank-scope" id="rank-scope"></p>
        <div class="rank-tabs" id="rank-tabs" role="tablist"></div>
        <ol class="rank-list" id="rank-list"></ol>
        <p class="rank-me" id="rank-me"></p>
      </div>
    </section>
  </main>
</div>
<script src="config.js"></script>
<script src="peel.js"></script>
</body>
</html>
