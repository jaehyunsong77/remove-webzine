<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>감귤 껍질 한 줄 까기</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fdf3e1">

<!-- RE:MOVE 웹진 감귤 미니게임 v3.0 픽셀 테마 (Claude Code 제작).
     게임 코드(조작·판정·점수·저장·랭킹)는 v2.0과 같고, 화면만 도트(픽셀아트) 테마로 바꿈:
     갈무리11 글꼴(OFL) · 코드로 그린 도트 감귤 캐릭터 · 구름/언덕/풀 배경 · 도트 버튼과 상자. GTM·GA4 코드 없음 -->
<link rel="preload" href="fonts/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<div class="app" id="app" data-screen="start">

  <main class="stage" id="board" aria-label="감귤 껍질 한 줄 까기">
    <canvas id="cv" aria-hidden="true"></canvas>

    <!-- 1. 시작 화면 -->
    <section class="screen start" id="start">
      <button type="button" class="icon-btn snd" id="snd" aria-pressed="true" aria-label="소리와 진동" data-place="peel20_sound">
        <i class="ico on" data-ico="snd" aria-hidden="true"></i><i class="ico off" data-ico="sndOff" aria-hidden="true"></i>
      </button>
      <p class="series"><i class="mk"></i>RE:MOVE MINI GAME<i class="mk r"></i></p>
      <h1 class="title"><span class="t1" data-t="감귤 껍질">감귤 껍질</span><span class="t2" data-t="한 줄 까기">한 줄 까기</span></h1>
      <canvas class="hero px" id="hero" aria-hidden="true"></canvas>
      <p class="lead">끊기지 않게 길게 벗겨보세요!</p>
      <button type="button" class="btn primary big" id="go" data-place="peel20_start"><span class="bt">게임 시작</span><i class="ico play" data-ico="play" aria-hidden="true"></i></button>
      <button type="button" class="rank-link" id="open-rank" data-place="peel20_rank_start"><i class="ico crown" data-ico="crown" aria-hidden="true"></i><span>TOP 5 랭킹</span></button>
    </section>

    <!-- 2·3. 게임 중 -->
    <div class="hud" id="hud" hidden>
      <div class="bar">
        <button type="button" class="icon-btn" id="back" aria-label="처음 화면으로" data-place="peel20_back">
          <i class="ico" data-ico="back" aria-hidden="true"></i>
        </button>
        <p class="pill" id="timer" hidden><i class="ico clock" data-ico="clock" aria-hidden="true"></i><span id="time">00:00</span><i class="sep" aria-hidden="true"></i><b id="live-score">0</b><small>점</small></p>
        <p class="dots" id="dots"></p>
      </div>
      <!-- 힘 바: 지금 당기는 빠르기 ÷ 끊어지는 빠르기. 빨간 눈금을 넘으면 껍질이 끊어짐 -->
      <div class="power" aria-hidden="true"><span class="pw-l">힘</span><span class="pw-bar"><i id="pbar"></i><em class="pw-limit"></em></span></div>
      <p class="tag" id="tag"><canvas class="face px" id="face" aria-hidden="true"></canvas><span id="tag-text">준비되었나요?</span></p>
      <p class="best-line" id="best-line"></p>
    </div>
    <div class="guide" id="guide" hidden>
      <i class="ico hand" data-ico="hand" aria-hidden="true"></i>
      <p>점선을 따라<br>감귤 껍질을 벗겨보세요!</p>
    </div>
    <p class="hint" id="hint" aria-hidden="true"></p>
    <p class="pop" id="pop" aria-hidden="true"></p>
    <p class="sr" id="live" aria-live="polite"></p>

    <!-- 4. 결과 -->
    <section class="screen result" id="over" hidden>
      <p class="series"><i class="mk"></i>RE:MOVE MINI GAME<i class="mk r"></i></p>
      <h2 class="r-title"><span id="r-title">완성!</span></h2>
      <canvas class="r-art px" id="r-art" aria-hidden="true"></canvas>
      <!-- 점수: 이번 점수 · 내 최고점수 · 갱신 여부(또는 최고 기록까지 남은 점수) -->
      <div class="score" id="score">
        <canvas class="face px" id="r-face" aria-hidden="true"></canvas>
        <p class="s-now"><em>이번 점수</em><b id="r-score">0</b></p>
        <p class="s-best"><em>내 최고점수</em><b id="r-best">0</b></p>
        <p class="s-msg" id="r-msg"></p>
      </div>
      <p class="r-rank" id="r-rank"><span id="r-rank-text"></span><button type="button" class="rank-link sm" id="open-rank2" data-place="peel20_rank_result">TOP 5 보기</button></p>
      <p class="r-sub" id="r-sub"></p>
      <p class="r-break" id="r-break"></p>
      <div class="btns">
        <button type="button" class="btn ghost" id="alt" data-place="peel20_home">메인으로</button>
        <button type="button" class="btn primary" id="main" data-place="peel20_retry">다시하기</button>
      </div>
      <button type="button" class="retry-link" id="retry-link" hidden data-place="peel20_retry_small">다시하기</button>
      <a class="cta" id="cta" href="#" target="_blank" rel="noopener" data-place="peel20_experience_tangerine"><span id="cta-label">제주 감귤따기 체험 보러가기</span><span class="go" aria-hidden="true">▶</span></a>
    </section>

    <!-- 단계별 TOP 5 랭킹(아래에서 올라오는 시트) -->
    <section class="rank-sheet" id="rank" hidden role="dialog" aria-modal="true" aria-labelledby="rank-h">
      <div class="rank-card">
        <button type="button" class="icon-btn rank-x" id="rank-close" aria-label="랭킹 닫기"><i class="ico" data-ico="close" aria-hidden="true"></i></button>
        <h2 class="rank-h" id="rank-h"><i class="ico crown" data-ico="crown" aria-hidden="true"></i>TOP 5</h2>
        <p class="rank-scope" id="rank-scope"></p>
        <div class="rank-tabs" id="rank-tabs" role="tablist"></div>
        <ol class="rank-list" id="rank-list"></ol>
        <p class="rank-me" id="rank-me"></p>
      </div>
    </section>
  </main>
</div>
<script src="config.js"></script>
<script src="peel.js"></script>

</body></html>
